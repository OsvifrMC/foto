<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фото</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            max-width: 450px;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            background: #fff;
            box-shadow: 0 20px 80px rgba(0,0,0,0.9);
            cursor: pointer;
        }
        .container img {
            width: 100%;
            display: block;
        }
        .caption {
            padding: 16px 20px 20px;
            background: #fff;
        }
        .caption .user {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .caption .user .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #555;
            font-weight: 600;
        }
        .caption .user .name {
            font-weight: 600;
            font-size: 15px;
            color: #222;
        }
        .caption .user .time {
            font-size: 13px;
            color: #888;
            margin-left: auto;
        }
        .caption .text {
            font-size: 15px;
            color: #222;
            line-height: 1.4;
        }
        .caption .likes {
            font-size: 14px;
            color: #888;
            margin-top: 6px;
        }

        /* ===== РОЗЫГРЫШ ===== */
        #prankOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 30px;
            text-align: center;
            border-radius: 24px;
            animation: pop 0.5s ease;
            z-index: 10;
        }
        #prankOverlay.active { display: flex; }
        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #prankOverlay h1 {
            font-size: 42px;
            color: #ff4053;
            margin-bottom: 6px;
        }
        #prankOverlay .sub {
            font-size: 20px;
            color: #fff;
            font-weight: 600;
            margin-bottom: 4px;
        }
        #prankOverlay .desc {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 12px;
        }
        #prankOverlay img {
            max-width: 160px;
            border-radius: 16px;
            margin-bottom: 12px;
        }
        #prankOverlay .btn-restart {
            padding: 12px 32px;
            background: #00a35e;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        #prankOverlay .btn-restart:active {
            transform: scale(0.95);
            background: #008c4a;
        }
        #prankOverlay .footnote {
            font-size: 13px;
            color: #666;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container" id="container">

        <!-- ===== ТВОЯ ФОТКА (вставь ссылку) ===== -->
        <img src="my photo.jpg" alt="Фото" id="mainImage">

        <div class="caption">
            <div class="user">
                <div class="avatar">👤</div>
                <span class="name">Ты</span>
                <span class="time">только что</span>
            </div>
            <div class="text">Привет! 👋 Смотри, какое фото</div>
            <div class="likes">❤️ 0</div>
        </div>

        <div id="prankOverlay">
            <h1>😅 ЭХ ТЫ!</h1>
            <div class="sub">Ты думал, это просто фото?</div>
            <div class="desc">А это подкол! 👊</div>
            <img src="https://media.giphy.com/media/3o6Zt6ML6BklcajjsA/giphy.gif" alt="Прикол">
            <button class="btn-restart" onclick="location.reload()">🔄 Открыть заново</button>
            <div class="footnote">Никаких вирусов, просто шутка ❤️</div>
        </div>
    </div>

    <script>
        document.getElementById('container').addEventListener('click', function() {
            document.getElementById('prankOverlay').classList.add('active');
        });
    </script>

</body>
</html>
</html>
